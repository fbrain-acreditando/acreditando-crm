# CI — NossoCRM
#
# Jobs:
#   commitlint — valida conventional commits (so em PR)
#   check      — lint + typecheck + tests (todo PR e push em main/feature/fix)
#
# NAO existe job de build aqui, de proposito. A integracao nativa da Vercel
# builda TODO PR (preview) e TODO push em main (production) — medido em
# `gh api repos/.../deployments`. O job `build` que existia aqui rodava
# `if: push && ref == main`, ou seja SO DEPOIS do merge: nunca pode barrar um
# PR ruim, e duplicava o build que a Vercel ja fazia. Removido em 19/08/2026.
# Se a integracao Vercel um dia sair, este job precisa voltar — e como gate de
# PR, nao pos-merge.
#
# Cache strategy:
#   - pnpm store: keyed on pnpm-lock.yaml hash via actions/setup-node cache: "pnpm"
#
# Security: no untrusted event inputs are interpolated into run: commands.

name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 20 saiu de suporte em abril/2026. 22 e o LTS ativo.
  # Este e o Node em que lint, typecheck, testes (e o build da Vercel) rodam.
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ─── commitlint ────────────────────────────────────────────────────────────
  # Validates commit messages follow conventional commits format
  # Runs only on PRs to catch format issues before merge
  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install commitlint
        run: npm install --save-dev @commitlint/cli @commitlint/config-conventional --legacy-peer-deps

      - name: Validate commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }}

  # ─── check ────────────────────────────────────────────────────────────────
  # Runs precheck:fast: ESLint (--max-warnings 0) + tsc --noEmit + vitest run
  # Fast path — no Next.js build required. Runs on all triggering events.
  check:
    name: Lint / Typecheck / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint — zero warnings)
        run: pnpm lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Tests (Vitest)
        run: pnpm test:run
